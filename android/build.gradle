apply plugin: 'com.android.library'
buildscript {
    repositories {
        mavenLocal()
        mavenCentral()
        google()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:7.4.2'
    }
}

repositories {
    mavenLocal()
    mavenCentral()
    google()
}
android {
    compileSdkVersion 31
    namespace 'com.razorpay.rn.custom'
    defaultConfig {
        minSdkVersion 21
        targetSdkVersion 31
        versionCode 1
        versionName "1.0"
    }
    
    buildFeatures {
        buildConfig false
    }
}

dependencies {
    implementation 'com.facebook.react:react-native:+'
    //implementation fileTree(dir: 'libs', include: '**/*.aar')
    implementation 'com.razorpay:customui-core:3.10.+'
}
